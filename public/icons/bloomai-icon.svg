<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">BloomAI</title>
  <desc id="desc">A glowing bloom orb on a deep navy rounded square.</desc>
  <defs>
    <linearGradient id="orb" x1="62" y1="54" x2="200" y2="211" gradientUnits="userSpaceOnUse">
      <stop stop-color="#64E4C3"/>
      <stop offset="0.48" stop-color="#58A6FF"/>
      <stop offset="1" stop-color="#6E5DF5"/>
    </linearGradient>
    <linearGradient id="bloom" x1="91" y1="205" x2="174" y2="45" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1D5BD1"/>
      <stop offset="1" stop-color="#71F1CB"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(128 128) rotate(90) scale(94)">
      <stop stop-color="#87F8DD" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#6E5DF5" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="58" fill="#0B1832"/>
  <circle cx="128" cy="128" r="95" fill="url(#glow)" filter="url(#softGlow)"/>
  <circle cx="128" cy="128" r="78" fill="url(#orb)"/>
  <path d="M128 42C158 63 177 86 177 114C177 145 155 165 128 165C101 165 79 145 79 114C79 86 98 63 128 42Z" fill="url(#bloom)"/>
  <path d="M128 77C142 93 151 107 151 124C151 139 141 149 128 149C115 149 105 139 105 124C105 107 114 93 128 77Z" fill="#FFFFFF" fill-opacity="0.9"/>
  <circle cx="184" cy="60" r="10" fill="#FFFFFF" fill-opacity="0.86"/>
</svg>
