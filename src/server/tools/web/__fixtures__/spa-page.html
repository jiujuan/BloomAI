<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>SPA fixture</title>
    <meta name="description" content="A local static shell that becomes useful after hydration.">
  </head>
  <body>
    <main id="app"><p>Loading application...</p></main>
    <script>
      document.querySelector('#app').innerHTML =
        '<h1>Hydrated SPA article</h1><p>' +
        'This paragraph is injected after JavaScript runs. '.repeat(12) +
        '</p><a href="/docs/getting-started">Getting started</a>'
    </script>
  </body>
</html>
