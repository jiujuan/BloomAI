      var needsFields = action === 'confirm-rollback';
      var fields = needsFields ? '<div class="grid-2 equal"><div class="field"><label for="incident-id">Incident ID</label><input id="incident-id" placeholder="INC-2026-" required></div><div class="field"><label for="rollback-owner">Owner</label><input id="rollback-owner" value="ops:wang" required></div></div><div class="field" style="margin-top:10px"><label for="rollback-reason">Reason</label><textarea id="rollback-reason" placeholder="记录触发条件和影响范围" required></textarea></div>' : '';
      document.getElementById('dialog-root').innerHTML = '<div class="dialog-backdrop" data-dialog-close="true"></div><section class="dialog-card" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><div class="dialog-head"><h2 id="dialog-title">' + esc(copy.title) + '</h2>' + iconButton('关闭弹窗', 'close-dialog', 'close') + '</div><div class="dialog-body"><div class="banner ' + copy.tone + '">' + icon(copy.icon, 17) + '<div><strong>' + esc(copy.title) + '</strong><p>' + esc(copy.body) + '</p></div></div>' + fields + '</div><div class="dialog-foot"><button type="button" class="button ghost" data-action="close-dialog">取消</button><button type="button" class="button ' + (copy.tone === 'danger' ? 'danger' : copy.tone === 'success' ? 'success' : 'primary') + '" data-confirm-action="' + esc(action) + '">' + icon(copy.icon, 14) + '<span>' + esc(copy.confirm) + '</span></button></div></section>';
      app.dialog = action;
      document.body.classList.add('is-locked');
      var close = document.querySelector('#dialog-root .dialog-card .icon-btn');
      if (close) close.focus();
    }
    function closeDialog() { document.getElementById('dialog-root').innerHTML = ''; app.dialog = null; if (!app.drawer) document.body.classList.remove('is-locked'); }
    function toast(title, message, tone) {
      var root = document.getElementById('toast-root');
      if (!root.querySelector('.toast-stack')) root.innerHTML = '<div class="toast-stack"></div>';
      var node = document.createElement('div');
      node.className = 'toast ' + (tone || 'info');
      node.innerHTML = icon(tone === 'success' ? 'checkCircle' : tone === 'danger' ? 'xCircle' : tone === 'warning' ? 'alertTriangle' : 'info', 16) + '<div><strong>' + esc(title) + '</strong><p>' + esc(message) + '</p></div><button type="button" class="icon-btn toast-close" aria-label="关闭提示" data-action="close-toast">' + icon('close', 14) + '</button>';
      root.querySelector('.toast-stack').appendChild(node);
      window.setTimeout(function () { if (node.parentNode) node.remove(); }, 4600);
    }

    function openInfoDialog(title, text, tone, iconName) {
      document.getElementById('dialog-root').innerHTML = '<div class="dialog-backdrop" data-dialog-close="true"></div><section class="dialog-card" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><div class="dialog-head"><h2 id="dialog-title">' + esc(title) + '</h2>' + iconButton('关闭弹窗', 'close-dialog', 'close') + '</div><div class="dialog-body"><div class="banner ' + (tone || 'info') + '">' + icon(iconName || 'info', 17) + '<div><strong>' + esc(title) + '</strong><p>' + esc(text) + '</p></div></div></div><div class="dialog-foot"><button type="button" class="button primary" data-action="close-dialog">完成</button></div></section>';
      app.dialog = 'info';
      document.body.classList.add('is-locked');
      var close = document.querySelector('#dialog-root .dialog-card .icon-btn');
      if (close) close.focus();
    }
    function showLongTask(title, text) {
      toast(title, text + ' · 页面关闭后仍可通过状态恢复。', 'info');
      window.setTimeout(function () { toast(title + ' 已完成', 'requestId=req_demo_' + Date.now().toString(36) + ' · 证据已写入 Audit。', 'success'); }, 900);
    }
    function goPage(page) {
      if (!pageMeta[page]) return;
      if (!canView(page)) {
        toast('Permission denied', roleLabel() + ' 无权访问 ' + titleFor(page) + '；页面数据范围由服务端会话控制。', 'danger');
        return;
      }
      app.page = page;
      closeDrawer();
      closeDialog();
      renderPage();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
    function refreshPage(message) { renderPage(); toast('已刷新', message || '已重新读取服务端状态摘要。', 'success'); }
    function performConfirm(action) {
      var i, item, id;
      if (action.indexOf('approve-') === 0) {
        id = action.slice('approve-'.length); item = findById(approvals, id); if (item) item.status = 'approved'; closeDialog(); renderPage(); toast('Approval 已批准', id + ' 已创建 Capability Grant 并写入 Audit。', 'success'); return;
      }
      if (action.indexOf('reject-') === 0) {
        id = action.slice('reject-'.length); item = findById(approvals, id); if (item) item.status = 'rejected'; closeDialog(); renderPage(); toast('Approval 已拒绝', id + ' 保留拒绝原因，原 Run 可按策略重试。', 'warning'); return;
      }
      if (action.indexOf('cancel-') === 0) {
        id = action.slice('cancel-'.length); item = findById(runs, id); if (item) item.status = 'canceled'; closeDialog(); renderPage(); toast('Run 已取消', id + ' 的状态转换和 Event 已持久化。', 'success'); return;
      }
      if (action.indexOf('retry-') === 0) {
        id = action.slice('retry-'.length); item = findById(runs, id); if (item) { item.status = 'running'; item.duration = '—'; } closeDialog(); renderPage(); toast('Retry 已提交', id + ' 创建新的执行尝试，保留原失败证据。', 'info'); return;
      }
      if (action === 'pause-new-run') {
        app.newRunsPaused = !app.newRunsPaused; closeDialog(); renderPage(); toast(app.newRunsPaused ? '新 Run 已暂停' : '新 Run 已恢复', app.newRunsPaused ? '新的执行入口由 Feature Gate 拦截，历史查询仍可用。' : '新的执行入口已重新开放。', app.newRunsPaused ? 'warning' : 'success'); return;
      }
      if (action === 'confirm-cleanup') { closeDialog(); showLongTask('Orphan Cleanup Dry-run 已开始', '正在扫描未关联 Run 的 Artifact 候选'); return; }
      if (action === 'confirm-rollback') { closeDialog(); app.runtime = 'readonly'; app.newRunsPaused = true; renderPage(); toast('应用 Rollback 已进入只读保护', '没有执行数据库 down migration；历史 Run / Event / Artifact 保留。', 'warning'); return; }
      if (action === 'confirm-migration-dry-run') { closeDialog(); showLongTask('Migration 043 Dry-run 已开始', 'inspect / plan / validate 正在执行'); return; }
      if (action === 'confirm-backup-rehearsal') { closeDialog(); showLongTask('Backup / Restore 演练已开始', '隔离环境正在验证 RPO、RTO 和 schema snapshot'); return; }
      if (action === 'confirm-drain-worker') { closeDialog(); workers[2].status = 'draining'; renderPage(); toast('Worker 已进入 draining', '停止接收新 lease，等待当前任务安全收敛。', 'warning'); return; }
      if (action === 'confirm-publish') { closeDialog(); drafts[0].status = 'published'; drafts[0].validation = 'passed'; renderPage(); toast('Draft 已发布', '已创建 immutable Skill Version，发布证据已关联。', 'success'); return; }
      closeDialog(); toast('操作已提交', '服务端将返回 requestId 和最终对象状态。', 'info');
    }
    function handleAction(action) {
      if (!action) return;
      if (action.indexOf('nav-') === 0) { goPage(action.slice(4)); return; }
      if (action.indexOf('open-package-') === 0 && action.indexOf('open-package-menu-') !== 0) { openDrawer('package', action.slice('open-package-'.length)); return; }
      if (action.indexOf('open-run-') === 0) { openDrawer('run', action.slice('open-run-'.length)); return; }
      if (action.indexOf('open-approval-') === 0) { openDrawer('approval', action.slice('open-approval-'.length)); return; }
      if (action.indexOf('open-artifact-') === 0) { openDrawer('artifact', action.slice('open-artifact-'.length)); return; }
      if (action.indexOf('open-migration-') === 0) { openDrawer('migration', action.slice('open-migration-'.length)); return; }
      if (action.indexOf('open-policy-') === 0) { openDrawer('policy', action.slice('open-policy-'.length)); return; }
      if (action.indexOf('open-audit-') === 0) { openDrawer('audit', action.slice('open-audit-'.length)); return; }
      if (action.indexOf('confirm-') === 0) { openConfirm(action); return; }
      if (action === 'close-drawer') { closeDrawer(); return; }
      if (action === 'close-dialog') { closeDialog(); return; }
      if (action === 'close-toast') { var t = document.querySelector('#toast-root .toast:last-child'); if (t) t.remove(); return; }
      if (action === 'toggle-theme') { app.theme = app.theme === 'dark' ? 'light' : 'dark'; document.documentElement.setAttribute('data-theme', app.theme); renderTopbar(); toast('主题已切换', app.theme === 'dark' ? 'Dark Mode' : 'Light Mode', 'info'); return; }
      if (action === 'cycle-workbench') { app.selectedWorkbench = app.selectedWorkbench === 'production' ? 'staging' : 'production'; renderSidebar(); renderTopbar(); toast('Workbench 已切换', app.selectedWorkbench + ' · 服务端数据范围已刷新。', 'info'); return; }
      if (action === 'pause-new-run') { if (app.role === 'user' || app.runtime === 'readonly' || app.runtime === 'disabled') { toast('操作不可用', '当前角色或 Runtime 不允许暂停新 Run。', 'warning'); return; } openConfirm(action); return; }
      if (action === 'refresh-page' || action === 'refresh-diagnostics') { refreshPage(action === 'refresh-diagnostics' ? 'Health、Worker 和 Queue 摘要已刷新。' : '列表和指标已刷新。'); return; }
      if (action === 'mobile-nav') { var sidebar = document.getElementById('sidebar'); sidebar.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); toast('导航已定位', '在窄屏下可横向滚动底部导航。', 'info'); return; }
      if (action === 'set-runtime') return;
      if (action === 'open-import') { openInfoDialog('导入 Package', '导入流程需要 manifest schema、签名、content hash 和服务端安全校验；GitHub import 当前为 Feature disabled。', 'info', 'upload'); return; }
      if (action === 'new-draft') { toast('Draft editor 已准备', '已打开 quarterly.insight 示例；保存和发布仍受角色与服务端策略约束。', 'success'); return; }
      if (action === 'save-draft') { toast('Draft 已保存', '草稿状态保持 editing，保存对象为当前用户范围。', 'success'); return; }
      if (action === 'submit-draft-review') { showLongTask('Draft review 已提交', '正在执行 manifest validate 和 capability review'); return; }
      if (action === 'open-capability-request') { openInfoDialog('提交 Capability Request', '填写 capability、最小 scope、使用理由和预期 TTL；请求提交后进入 Approval Queue，默认不会直接授予。', 'warning', 'key'); return; }
      if (action === 'open-policy-editor') { openInfoDialog('Policy editor', '管理员可以修改 default、scope、TTL 和 package allowlist；每次修改都生成 Audit event，服务端重新计算最终策略。', 'info', 'settings'); return; }
      if (action === 'open-broker-status') { openInfoDialog('Capability Broker', 'Broker healthy · decision latency p95=42ms · default deny enforced · 42 active grants。', 'success', 'shieldCheck'); return; }
      if (action === 'open-feature-creator') { openInfoDialog('Creator Feature Gate', 'Creator publish 对当前运维角色是只读查看；需要管理员发布，服务端负责最终鉴权。', 'warning', 'flag'); return; }
      if (action === 'open-legacy-assessment') { showLongTask('Legacy 迁移评估已开始', '正在扫描 adapter、requested capability 和历史 Run'); return; }
      if (action === 'generate-diagnostic-bundle') { showLongTask('诊断包生成中', '只包含脱敏 correlation、错误分类、指标和 schema 信息'); return; }
      if (action === 'generate-release-evidence' || action === 'generate-audit-evidence') { showLongTask('验收证据生成中', '正在关联 Gate、Migration、Health、Audit 和 Runbook'); return; }
      if (action.indexOf('export-') === 0 || action.indexOf('download-') === 0) { showLongTask('导出任务已提交', '正在生成脱敏文件并写入 Audit'); return; }
      if (action === 'open-install-events' || action === 'open-orphan-evidence' || action === 'open-schema-snapshot' || action === 'open-backup-evidence' || action === 'open-runbook' || action === 'download-evidence') { openInfoDialog('关联证据', '该入口会打开服务端返回的脱敏 Event、Schema snapshot、Backup rehearsal 或 Runbook 证据。', 'info', 'scroll'); return; }
      if (action === 'show-filter-state') { toast('高级筛选已展开', '可组合 Workbench、版本、状态、owner、requestId 和时间范围。', 'info'); return; }
      if (action === 'copy-run-id') { var runId = 'run_01JZ9R2MK7'; if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(runId).catch(function () {}); toast('Run ID 已复制', runId, 'success'); return; }
      if (action.indexOf('open-package-menu-') === 0) { openInfoDialog('Package actions', '可进入 Version、Installation、Policy、Run 和 Audit 关联对象。', 'info', 'more'); return; }
      if (action.indexOf('open-version-') === 0 || action.indexOf('open-draft-') === 0 || action.indexOf('open-legacy-') === 0 || action.indexOf('open-policy-') === 0) { openInfoDialog('对象详情', '该对象详情使用同一套抽屉和权限边界；原型保留关联对象链路。', 'info', 'eye'); return; }
      if (action === 'confirm-cancel' || action === 'confirm-retry') { openConfirm(action); return; }
      toast('已触发操作', action, 'info');
    }

    document.addEventListener('click', function (event) {
      var nav = event.target.closest('[data-nav]');
      if (nav) { event.preventDefault(); goPage(nav.getAttribute('data-nav')); return; }
      var openPackage = event.target.closest('[data-open-package]');
      if (openPackage) { event.preventDefault(); openDrawer('package', openPackage.getAttribute('data-open-package')); return; }
      var openRun = event.target.closest('[data-open-run]');
      if (openRun) { event.preventDefault(); openDrawer('run', openRun.getAttribute('data-open-run')); return; }
      if (event.target.closest('[data-drawer-close]')) { closeDrawer(); return; }
      if (event.target.closest('[data-dialog-close]')) { closeDialog(); return; }
      var confirmButton = event.target.closest('[data-confirm-action]');
      if (confirmButton) { performConfirm(confirmButton.getAttribute('data-confirm-action')); return; }
      var actionNode = event.target.closest('[data-action]');
      if (actionNode) { handleAction(actionNode.getAttribute('data-action')); return; }
      var runtimeNode = event.target.closest('[data-set-runtime]');
      if (runtimeNode) { app.runtime = runtimeNode.getAttribute('data-set-runtime'); renderPage(); toast('Runtime 状态已切换', runtime().label + ' · ' + runtime().cn, app.runtime === 'healthy' ? 'success' : 'warning'); return; }
    });
    document.addEventListener('change', function (event) {
      if (event.target.id === 'role-select') { app.role = event.target.value; if (!canView(app.page)) app.page = 'overview'; renderPage(); toast('角色已切换', roleLabel() + ' · ' + roleDescriptions[app.role], 'info'); }
    });
    document.addEventListener('input', function (event) {
      if (event.target.id === 'global-search') app.search = event.target.value;
    });
    document.addEventListener('keydown', function (event) {
      if (event.key === 'Escape') { if (app.dialog) closeDialog(); else if (app.drawer) closeDrawer(); }
      if (event.key === '/' && document.activeElement && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA') { event.preventDefault(); var search = document.getElementById('global-search'); if (search) search.focus(); }
    });
    document.documentElement.setAttribute('data-theme', app.theme);
    renderPage();
  })();
  </script>
</body>
</html>
