<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="BloomAI Skills 管理工作台 v1.2 交互式后台原型，沿用 BloomAI 当前暖灰/白色基础配色、品牌渐变和语义状态色。">
  <title>BloomAI · Skills Management Console v1.2</title>
  <style>
    :root {
      --bg: #f4f6f8;
      --surface: #ffffff;
      --surface-muted: #f7f9fb;
      --surface-raised: #ffffff;
      --ink: #16212b;
      --ink-soft: #42505c;
      --muted: #758391;
      --faint: #9aa7b3;
      --line: #dce3e9;
      --line-strong: #c7d0d8;
      --rail: #1e2933;
      --rail-soft: #2a3742;
      --rail-ink: #dce6ed;
      --blue: #22769c;
      --blue-deep: #145776;
      --blue-bg: #e7f3f8;
      --teal: #287d70;
      --teal-bg: #e8f5f1;
      --amber: #a66b16;
      --amber-bg: #fff4d9;
      --red: #b2443d;
      --red-bg: #fbeceb;
      --purple: #6c5b98;
      --purple-bg: #f0edfa;
      --shadow-sm: 0 1px 2px rgba(24, 40, 54, .05);
      --shadow-md: 0 12px 30px rgba(24, 40, 54, .12);
      --radius-sm: 5px;
      --radius-md: 8px;
      --radius-lg: 12px;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      --mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; font-family: var(--font); background: var(--bg); color: var(--ink); }
    body { font-size: 13px; line-height: 1.45; }
    button, input, textarea, select { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible, [tabindex]:focus-visible { outline: 3px solid rgba(34,118,156,.24); outline-offset: 2px; }
    .app-shell { min-height: 100vh; display: grid; grid-template-columns: 240px minmax(0, 1fr); }
    .sidebar { background: var(--rail); color: var(--rail-ink); display: flex; flex-direction: column; min-height: 100vh; border-right: 1px solid #172029; }
    .brand { padding: 22px 18px 18px; display: flex; gap: 11px; align-items: center; border-bottom: 1px solid rgba(255,255,255,.08); }
    .brand-mark { width: 34px; height: 34px; border-radius: 9px; background: #d7eef2; color: #1d6e78; display: grid; place-items: center; font-weight: 800; letter-spacing: -1px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.5); }
    .brand-copy strong { display: block; font-size: 15px; letter-spacing: -.2px; }
    .brand-copy small { display: block; color: #9caebd; margin-top: 2px; font-size: 11px; }
    .sidebar-scroll { padding: 17px 12px; overflow: auto; }
    .nav-label { color: #80909e; font-size: 10px; text-transform: uppercase; letter-spacing: .14em; padding: 10px 10px 7px; }
    .nav-item { width: 100%; border: 0; background: transparent; color: #c8d3dc; display: flex; align-items: center; gap: 10px; text-align: left; padding: 10px 11px; border-radius: 7px; margin: 2px 0; transition: background .15s, color .15s; }
    .nav-item:hover { background: rgba(255,255,255,.07); color: #fff; }
    .nav-item.active { background: #314452; color: #fff; box-shadow: inset 3px 0 0 #65b9c7; }
    .nav-icon { width: 17px; height: 17px; display: grid; place-items: center; color: #93a7b5; flex: 0 0 auto; }
    .nav-item.active .nav-icon { color: #93d2d9; }
    .nav-name { flex: 1; }
    .nav-count { min-width: 20px; padding: 2px 6px; border-radius: 99px; color: #bad0db; background: rgba(255,255,255,.08); text-align: center; font-size: 11px; }
    .sidebar-footer { margin-top: auto; padding: 14px 14px 16px; border-top: 1px solid rgba(255,255,255,.08); }
    .workspace-switcher { display: flex; align-items: center; gap: 9px; padding: 10px; border-radius: 8px; background: rgba(255,255,255,.05); }
    .workspace-avatar { width: 28px; height: 28px; border-radius: 7px; background: #5b8e9e; color: #effcff; display: grid; place-items: center; font-weight: 700; }
    .workspace-copy { min-width: 0; flex: 1; }
    .workspace-copy strong { display: block; font-size: 12px; }
    .workspace-copy small { display: block; color: #9aadb9; font-size: 10px; margin-top: 2px; }
    .main-shell { min-width: 0; display: flex; flex-direction: column; }
    .topbar { height: 68px; display: flex; align-items: center; gap: 18px; padding: 0 30px; background: rgba(255,255,255,.92); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 20; }
    .crumbs { display: flex; align-items: center; gap: 8px; white-space: nowrap; color: var(--muted); }
    .crumbs strong { color: var(--ink); font-weight: 680; }
    .crumbs .slash { color: #b5c0c8; }
    .topbar-tools { display: flex; align-items: center; gap: 9px; margin-left: auto; }
    .searchbox { width: min(320px, 28vw); height: 34px; display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--surface-muted); padding: 0 10px; border-radius: 7px; color: var(--muted); }
    .searchbox input { border: 0; outline: 0; background: transparent; color: var(--ink); width: 100%; min-width: 0; }
    .icon { width: 16px; height: 16px; display: inline-grid; place-items: center; flex: 0 0 auto; }
    .icon svg { width: 100%; height: 100%; display: block; }
    .icon-button { width: 34px; height: 34px; border: 1px solid var(--line); background: var(--surface); color: var(--ink-soft); border-radius: 7px; display: grid; place-items: center; }
    .icon-button:hover { background: var(--surface-muted); }
    .avatar { width: 31px; height: 31px; border-radius: 50%; background: #203f51; color: white; display: grid; place-items: center; font-weight: 700; font-size: 11px; }
    .page { padding: 26px 30px 42px; min-width: 0; }
    .page-head { display: flex; justify-content: space-between; gap: 20px; align-items: flex-start; margin-bottom: 22px; }
    .eyebrow { color: var(--blue); font-size: 11px; font-weight: 750; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 6px; }
    h1, h2, h3, p { margin: 0; }
    h1 { font-size: 26px; line-height: 1.2; letter-spacing: -.03em; }
    h2 { font-size: 17px; line-height: 1.3; letter-spacing: -.01em; }
    h3 { font-size: 14px; }
    .page-subtitle { margin-top: 7px; color: var(--muted); max-width: 730px; }
    .page-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
    .btn { border: 1px solid var(--line); background: var(--surface); color: var(--ink-soft); height: 34px; padding: 0 12px; border-radius: 7px; display: inline-flex; align-items: center; justify-content: center; gap: 7px; font-weight: 620; white-space: nowrap; box-shadow: var(--shadow-sm); }
    .btn:hover { background: var(--surface-muted); }
    .btn.primary { color: white; background: var(--blue); border-color: var(--blue); }
    .btn.primary:hover { background: var(--blue-deep); }
    .btn.soft { color: var(--blue-deep); background: var(--blue-bg); border-color: #b8d9e5; box-shadow: none; }
    .btn.warning { color: var(--amber); background: var(--amber-bg); border-color: #efd7a2; box-shadow: none; }
    .btn.danger { color: var(--red); background: var(--red-bg); border-color: #efc1bd; box-shadow: none; }
    .btn.ghost { border-color: transparent; background: transparent; box-shadow: none; }
    .btn.sm { height: 30px; padding: 0 9px; font-size: 12px; }
    .btn .icon { width: 15px; height: 15px; }
    .panel { border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius-md); box-shadow: var(--shadow-sm); }
    .panel-header { min-height: 54px; padding: 15px 17px; display: flex; justify-content: space-between; align-items: center; gap: 12px; border-bottom: 1px solid var(--line); }
    .panel-title { display: flex; align-items: center; gap: 9px; }
    .panel-title .muted { color: var(--muted); font-weight: 500; }
    .panel-body { padding: 17px; }
    .grid-4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
    .metric { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 15px 16px; box-shadow: var(--shadow-sm); }
    .metric-top { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; }
    .metric-value { font-size: 27px; font-weight: 740; margin-top: 9px; letter-spacing: -.04em; }
    .metric-foot { color: var(--muted); font-size: 11px; margin-top: 6px; }
    .metric-foot .up { color: var(--teal); font-weight: 700; }
    .metric-icon { width: 30px; height: 30px; border-radius: 7px; display: grid; place-items: center; }
    .metric-icon.blue { color: var(--blue); background: var(--blue-bg); }
    .metric-icon.teal { color: var(--teal); background: var(--teal-bg); }
    .metric-icon.amber { color: var(--amber); background: var(--amber-bg); }
    .metric-icon.purple { color: var(--purple); background: var(--purple-bg); }
    .section-gap { margin-top: 18px; }
    .toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .input, .select { height: 34px; border: 1px solid var(--line); background: var(--surface-muted); color: var(--ink); border-radius: 7px; padding: 0 10px; min-width: 0; }
    .input::placeholder { color: #9ca9b4; }
    .select { padding-right: 28px; }
    .toolbar .input { min-width: 210px; }
    .tabs { display: flex; gap: 3px; border-bottom: 1px solid var(--line); padding: 0 16px; overflow-x: auto; }
    .tab { position: relative; border: 0; background: transparent; color: var(--muted); padding: 12px 10px 11px; white-space: nowrap; font-weight: 650; }
    .tab:hover { color: var(--ink); }
    .tab.active { color: var(--blue-deep); }
    .tab.active::after { content: ""; position: absolute; left: 9px; right: 9px; bottom: -1px; height: 2px; background: var(--blue); border-radius: 2px 2px 0 0; }
    .table-wrap { overflow: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 850px; }
    th, td { padding: 13px 17px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: middle; }
    th { background: var(--surface-muted); color: var(--muted); font-size: 11px; font-weight: 760; letter-spacing: .03em; white-space: nowrap; }
    tr:last-child td { border-bottom: 0; }
    tbody tr { transition: background .14s; }
    tbody tr:hover { background: #fbfcfd; }
    .skill-cell { display: flex; gap: 10px; align-items: center; min-width: 250px; }
    .skill-logo { width: 34px; height: 34px; border-radius: 8px; display: grid; place-items: center; font-size: 11px; font-weight: 800; flex: 0 0 auto; }
    .logo-blue { color: #17647d; background: #dff0f4; }
    .logo-teal { color: #236e61; background: #dff2ea; }
    .logo-amber { color: #8d5b13; background: #fcedc6; }
    .logo-purple { color: #63528c; background: #eee9fb; }
    .skill-title { font-weight: 700; color: var(--ink); }
    .skill-meta { color: var(--muted); font-size: 11px; margin-top: 3px; }
    .badge { display: inline-flex; align-items: center; gap: 5px; border-radius: 99px; padding: 4px 8px; font-size: 11px; font-weight: 700; white-space: nowrap; }
    .badge::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
    .badge.blue { color: var(--blue); background: var(--blue-bg); }
    .badge.teal { color: var(--teal); background: var(--teal-bg); }
    .badge.amber { color: var(--amber); background: var(--amber-bg); }
    .badge.red { color: var(--red); background: var(--red-bg); }
    .badge.gray { color: var(--muted); background: #eef1f4; }
    .badge.purple { color: var(--purple); background: var(--purple-bg); }
    .badge.no-dot::before { display: none; }
    .risk { color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
    .risk-dot { width: 7px; height: 7px; border-radius: 50%; }
    .risk-low .risk-dot { background: var(--teal); }
    .risk-medium .risk-dot { background: var(--amber); }
    .risk-high .risk-dot { background: var(--red); }
    .row-actions { display: flex; gap: 4px; justify-content: flex-end; min-width: 132px; overflow: visible; }
    .icon-btn { position: relative; z-index: 1; width: 29px; height: 29px; border: 1px solid transparent; border-radius: 6px; background: transparent; color: var(--muted); display: grid; place-items: center; transition: border-color .15s, background .15s, color .15s; }
    .icon-btn:hover, .icon-btn:focus-visible { border-color: var(--line); background: var(--surface-muted); color: var(--ink); z-index: 4; }
    .icon-btn[data-tooltip]::after { content: attr(data-tooltip); position: absolute; right: 0; top: calc(100% + 8px); z-index: 30; opacity: 0; pointer-events: none; white-space: nowrap; padding: 5px 8px; border-radius: 5px; color: #fff; background: #242422; font-size: 11px; font-weight: 600; line-height: 1.3; box-shadow: 0 5px 14px rgba(24, 40, 54, .16); transform: translateY(-3px); transition: opacity .15s ease, transform .15s ease; }
    .icon-btn[data-tooltip]:hover::after, .icon-btn[data-tooltip]:focus-visible::after { opacity: 1; transform: translateY(0); }
    .icon-btn.danger:hover, .icon-btn.danger:focus-visible { border-color: #efc1bd; background: var(--red-bg); color: var(--red); }
    .empty-state { min-height: 250px; display: grid; place-items: center; text-align: center; color: var(--muted); padding: 28px; }
    .empty-icon { width: 44px; height: 44px; display: grid; place-items: center; margin: 0 auto 10px; color: var(--blue); background: var(--blue-bg); border-radius: 12px; }
    .two-col { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(300px, .9fr); gap: 18px; }
    .three-col { display: grid; grid-template-columns: minmax(210px, .72fr) minmax(440px, 1.5fr) minmax(300px, .9fr); gap: 18px; }
    .mini-list { display: grid; gap: 0; }
    .mini-item { display: flex; align-items: center; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--line); }
    .mini-item:last-child { border-bottom: 0; padding-bottom: 0; }
    .mini-item:first-child { padding-top: 0; }
    .mini-copy { min-width: 0; flex: 1; }
    .mini-copy strong { display: block; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .mini-copy small { display: block; color: var(--muted); margin-top: 3px; }
    .mini-value { color: var(--ink-soft); font-size: 12px; white-space: nowrap; }
    .progress { height: 6px; background: #edf1f3; border-radius: 99px; overflow: hidden; }
    .progress > span { display: block; height: 100%; border-radius: inherit; background: var(--blue); }
    .progress.teal > span { background: var(--teal); }
    .progress.amber > span { background: var(--amber); }
    .notice { padding: 12px 14px; display: flex; align-items: flex-start; gap: 10px; border: 1px solid; border-radius: 8px; }
    .notice.blue { color: var(--blue-deep); background: var(--blue-bg); border-color: #bfdee8; }
    .notice.amber { color: #7d5616; background: var(--amber-bg); border-color: #ebd39f; }
    .notice.red { color: #8f3d38; background: var(--red-bg); border-color: #eac3bf; }
    .notice strong { display: block; margin-bottom: 2px; }
    .notice p { color: inherit; opacity: .86; }
    .view { display: none; }
    .view.active { display: block; }
    .hero-card { padding: 18px; display: flex; align-items: flex-start; gap: 15px; }
    .hero-logo { width: 50px; height: 50px; border-radius: 12px; display: grid; place-items: center; font-weight: 800; font-size: 15px; flex: 0 0 auto; }
    .hero-main { flex: 1; min-width: 0; }
    .hero-main h2 { font-size: 22px; letter-spacing: -.03em; }
    .hero-main p { color: var(--muted); margin-top: 5px; max-width: 760px; }
    .hero-meta { display: flex; gap: 7px; flex-wrap: wrap; margin-top: 10px; }
    .hero-actions { display: flex; gap: 7px; flex-wrap: wrap; justify-content: flex-end; }
    .detail-tabs { margin-top: 18px; }
    .detail-content { padding-top: 18px; }
    .info-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
    .info-box { border: 1px solid var(--line); border-radius: 7px; padding: 12px; background: var(--surface-muted); }
    .info-box dt { color: var(--muted); font-size: 11px; }
    .info-box dd { margin: 4px 0 0; font-weight: 700; color: var(--ink-soft); }
    .cap-list { display: flex; gap: 7px; flex-wrap: wrap; }
    .chip { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--line); background: var(--surface-muted); color: var(--ink-soft); padding: 5px 8px; border-radius: 99px; font-size: 11px; }
    .chip .chip-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--blue); }
    .code-preview { margin: 0; padding: 16px; background: #1e2933; color: #d6e5eb; border-radius: 8px; font: 12px/1.65 var(--mono); overflow: auto; min-height: 230px; white-space: pre-wrap; }
    .code-preview .syntax-key { color: #91d4da; }
    .code-preview .syntax-comment { color: #8ea1ab; }
    .code-preview .syntax-string { color: #efd38b; }
    .tree { display: grid; gap: 3px; font-size: 12px; }
    .tree-row { display: flex; align-items: center; gap: 8px; padding: 7px 8px; border-radius: 6px; color: var(--ink-soft); }
    .tree-row:hover, .tree-row.selected { background: var(--blue-bg); color: var(--blue-deep); }
    .tree-indent-1 { padding-left: 27px; }
    .tree-indent-2 { padding-left: 46px; }
    .tree-name { flex: 1; }
    .tree-size { color: var(--faint); font: 10px var(--mono); }
    .stepper { display: flex; gap: 3px; align-items: center; margin-bottom: 18px; overflow-x: auto; }
    .step { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; white-space: nowrap; }
    .step:not(:last-child)::after { content: ""; width: 28px; height: 1px; background: var(--line-strong); margin: 0 3px; }
    .step-num { width: 23px; height: 23px; border: 1px solid var(--line-strong); border-radius: 50%; display: grid; place-items: center; font-weight: 750; }
    .step.active { color: var(--blue-deep); font-weight: 700; }
    .step.active .step-num { color: white; background: var(--blue); border-color: var(--blue); }
    .step.done { color: var(--teal); }
    .step.done .step-num { color: white; background: var(--teal); border-color: var(--teal); }
    .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 15px; }
    .field { display: grid; gap: 6px; }
    .field.full { grid-column: 1 / -1; }
    .field label { color: var(--ink-soft); font-size: 12px; font-weight: 700; }
    .field label span { color: var(--red); }
    .field input, .field select, .field textarea { width: 100%; padding: 9px 10px; border: 1px solid var(--line); background: var(--surface-muted); border-radius: 7px; color: var(--ink); }
    .field textarea { resize: vertical; min-height: 93px; line-height: 1.55; }
    .helper { color: var(--muted); font-size: 11px; }
    .toggle-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line); }
    .toggle-row:last-child { border-bottom: 0; }
    .toggle-copy { flex: 1; }
    .toggle-copy strong { display: block; font-size: 12px; }
    .toggle-copy small { display: block; color: var(--muted); margin-top: 2px; }
    .switch { position: relative; width: 38px; height: 21px; flex: 0 0 auto; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; inset: 0; border-radius: 99px; background: #cfd8df; transition: .16s; cursor: pointer; }
    .slider::before { content: ""; position: absolute; width: 17px; height: 17px; left: 2px; top: 2px; border-radius: 50%; background: white; box-shadow: 0 1px 2px rgba(0,0,0,.18); transition: .16s; }
    .switch input:checked + .slider { background: var(--teal); }
    .switch input:checked + .slider::before { transform: translateX(17px); }
    .cap-select-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .cap-option { border: 1px solid var(--line); background: var(--surface-muted); border-radius: 7px; padding: 10px; display: flex; align-items: flex-start; gap: 9px; cursor: pointer; }
    .cap-option:hover { border-color: #9bc6d6; background: #f5fbfd; }
    .cap-option input { margin-top: 2px; accent-color: var(--blue); }
    .cap-option strong { display: block; font-size: 12px; }
    .cap-option small { display: block; color: var(--muted); margin-top: 2px; }
    .creator-preview { position: sticky; top: 90px; }
    .creator-preview .code-preview { min-height: 320px; }
    .validation-list { display: grid; gap: 8px; }
    .validation-row { display: flex; align-items: center; gap: 8px; color: var(--ink-soft); font-size: 12px; }
    .validation-ok { color: var(--teal); }
    .validation-warn { color: var(--amber); }
    .run-summary { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-bottom: 18px; }
    .run-kpi { border: 1px solid var(--line); background: var(--surface-muted); border-radius: 7px; padding: 12px; }
    .run-kpi small { color: var(--muted); display: block; }
    .run-kpi strong { display: block; margin-top: 5px; font-size: 17px; }
    .timeline { position: relative; display: grid; gap: 0; }
    .timeline::before { content: ""; position: absolute; left: 8px; top: 9px; bottom: 9px; width: 1px; background: var(--line); }
    .timeline-item { display: grid; grid-template-columns: 17px minmax(0, 1fr); gap: 11px; position: relative; padding-bottom: 17px; }
    .timeline-dot { width: 17px; height: 17px; border-radius: 50%; background: var(--surface); border: 3px solid var(--blue); z-index: 1; }
    .timeline-dot.success { border-color: var(--teal); }
    .timeline-dot.warn { border-color: var(--amber); }
    .timeline-dot.danger { border-color: var(--red); }
    .timeline-copy { min-width: 0; }
    .timeline-title { font-weight: 700; }
    .timeline-meta { color: var(--muted); font-size: 11px; margin-top: 3px; }
    .timeline-detail { margin-top: 7px; padding: 8px 10px; background: var(--surface-muted); border: 1px solid var(--line); border-radius: 6px; color: var(--ink-soft); font-size: 11px; }
    .artifact-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
    .artifact-card { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
    .artifact-thumb { height: 125px; background: #e9eff2; display: grid; place-items: center; color: var(--blue); }
    .artifact-thumb.image { background: #dcecef; color: #2c707b; }
    .artifact-thumb.pdf { background: #f7e4e0; color: var(--red); }
    .artifact-thumb.markdown { background: #e6f1e7; color: var(--teal); }
    .artifact-body { padding: 11px; }
    .artifact-name { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .artifact-meta { color: var(--muted); font-size: 11px; margin-top: 4px; }
    .artifact-foot { display: flex; justify-content: space-between; align-items: center; gap: 6px; margin-top: 10px; }
    .settings-grid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(300px, .75fr); gap: 18px; }
    .setting-group + .setting-group { margin-top: 22px; }
    .setting-group h3 { margin-bottom: 5px; }
    .setting-group > p { color: var(--muted); font-size: 12px; margin-bottom: 7px; }
    .modal-backdrop { position: fixed; inset: 0; background: rgba(18,30,39,.45); display: none; align-items: center; justify-content: center; padding: 20px; z-index: 50; }
    .modal-backdrop.open { display: flex; }
    .modal { width: min(560px, 100%); max-height: min(720px, 92vh); overflow: auto; border-radius: 11px; background: var(--surface); box-shadow: var(--shadow-md); border: 1px solid rgba(255,255,255,.35); }
    .modal.wide { width: min(820px, 100%); }
    .modal-head { padding: 17px 18px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 12px; align-items: center; }
    .modal-head h2 { font-size: 17px; }
    .modal-body { padding: 18px; }
    .modal-foot { padding: 13px 18px; border-top: 1px solid var(--line); display: flex; justify-content: flex-end; gap: 8px; }
    .close-btn { width: 30px; height: 30px; border: 1px solid transparent; border-radius: 6px; background: transparent; color: var(--muted); display: grid; place-items: center; }
    .close-btn:hover { border-color: var(--line); background: var(--surface-muted); color: var(--ink); }
    .source-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; }
    .source-card { border: 1px solid var(--line); border-radius: 8px; padding: 12px; background: var(--surface-muted); text-align: left; }
    .source-card.selected { border-color: var(--blue); background: var(--blue-bg); box-shadow: inset 0 0 0 1px var(--blue); }
    .source-card strong { display: block; margin-top: 7px; }
    .source-card small { display: block; color: var(--muted); margin-top: 3px; }
    .source-card .source-icon { width: 25px; height: 25px; border-radius: 6px; display: grid; place-items: center; background: var(--surface); color: var(--blue); }
    .drop-zone { border: 1px dashed #a5bac5; border-radius: 8px; background: #f7fbfc; padding: 20px; text-align: center; color: var(--muted); }
    .drop-zone strong { color: var(--blue-deep); display: block; margin-bottom: 3px; }
    .toast-stack { position: fixed; right: 22px; bottom: 22px; z-index: 70; display: grid; gap: 8px; width: min(330px, calc(100vw - 44px)); }
    .toast { border: 1px solid var(--line); background: var(--surface); box-shadow: var(--shadow-md); border-radius: 8px; padding: 12px 13px; display: flex; align-items: flex-start; gap: 9px; animation: toast-in .18s ease-out; }
    .toast strong { display: block; }
    .toast small { display: block; color: var(--muted); margin-top: 2px; }
    @keyframes toast-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .mobile-menu { display: none; }
    .mono { font-family: var(--mono); }
    .muted { color: var(--muted); }
    .right { text-align: right; }
    .mt-10 { margin-top: 10px; }
    .mt-14 { margin-top: 14px; }
    .mt-18 { margin-top: 18px; }
    .mb-12 { margin-bottom: 12px; }
    .divider { height: 1px; background: var(--line); margin: 16px 0; }
    .callout-list { display: grid; gap: 9px; }
    .callout-row { display: flex; gap: 9px; align-items: flex-start; }
    .callout-row strong { display: block; }
    .callout-row small { display: block; color: var(--muted); margin-top: 2px; }
    @media (max-width: 1180px) {
      .app-shell { grid-template-columns: 218px minmax(0, 1fr); }
      .page { padding-left: 22px; padding-right: 22px; }
      .topbar { padding-left: 22px; padding-right: 22px; }
      .three-col { grid-template-columns: 190px minmax(390px, 1.4fr) minmax(270px, .85fr); }
    }
    @media (max-width: 960px) {
      .app-shell { grid-template-columns: 70px minmax(0, 1fr); }
      .brand { justify-content: center; padding: 15px 10px; }
      .brand-copy, .nav-name, .nav-count, .nav-label, .workspace-copy { display: none; }
      .sidebar-scroll { padding: 12px 9px; }
      .nav-item { justify-content: center; padding: 11px 0; }
      .sidebar-footer { padding: 12px 9px; }
      .workspace-switcher { justify-content: center; padding: 9px 0; }
      .topbar { gap: 10px; }
      .crumbs { display: none; }
      .mobile-menu { display: grid; }
      .grid-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .two-col, .settings-grid { grid-template-columns: 1fr; }
      .three-col { grid-template-columns: 1fr; }
      .creator-preview { position: static; }
    }
    @media (max-width: 640px) {
      .app-shell { display: block; }
      .sidebar { display: none; }
      .topbar { height: 60px; padding: 0 14px; }
      .topbar-tools { gap: 6px; }
      .searchbox { width: auto; flex: 1; }
      .page { padding: 18px 14px 30px; }
      .page-head { display: block; }
      .page-actions { justify-content: flex-start; margin-top: 13px; }
      h1 { font-size: 23px; }
      .grid-4 { grid-template-columns: 1fr 1fr; gap: 8px; }
      .metric { padding: 12px; }
      .metric-value { font-size: 22px; }
      .artifact-grid { grid-template-columns: 1fr 1fr; }
      .form-grid, .cap-select-grid, .info-grid, .run-summary { grid-template-columns: 1fr; }
      .hero-card { display: block; }
      .hero-actions { justify-content: flex-start; margin-top: 14px; }
      .source-grid { grid-template-columns: 1fr; }
      .panel-header { display: block; }
      .panel-header .toolbar { margin-top: 11px; }
      .toolbar .input { min-width: 0; width: 100%; }
    }

    /* v1.2 visual system: align the standalone prototype with BloomAI's current renderer tokens. */
    :root {
      --bg: #f5f5f4;
      --surface: #ffffff;
      --surface-muted: #f5f5f4;
      --surface-raised: #ffffff;
      --ink: #1a1a18;
      --ink-soft: #3d3d3a;
      --muted: #73726c;
      --faint: #a8a69e;
      --line: #dddbd6;
      --line-strong: #b8b5ae;
      --rail: #f5f5f4;
      --rail-soft: #eeede9;
      --rail-ink: #3d3d3a;
      --blue: #0c447c;
      --blue-deep: #08365f;
      --blue-bg: #eff5fc;
      --teal: #085041;
      --teal-bg: #edf7f2;
      --amber: #633806;
      --amber-bg: #fef5e8;
      --red: #7a1b1b;
      --red-bg: #fcebeb;
      --purple: #534ab7;
      --purple-bg: #f2f0ff;
      --brand-purple: #7c6ff7;
      --brand-blue: #4b9bf5;
      --success-border: #5dcaa5;
      --warning-border: #ef9f27;
      --danger-border: #f09595;
      --shadow-sm: 0 1px 3px rgba(0, 0, 0, .08);
      --shadow-md: 0 8px 24px rgba(0, 0, 0, .12);
      --radius-sm: 4px;
      --radius-md: 6px;
      --radius-lg: 10px;
    }
    html, body { background: var(--bg); color: var(--ink); }
    button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible, [tabindex]:focus-visible { outline-color: rgba(83, 74, 183, .3); }
    .sidebar { background: var(--rail); color: var(--rail-ink); border-right: .5px solid var(--line); }
    .brand { border-bottom-color: var(--line); }
    .brand-mark { background: linear-gradient(135deg, var(--brand-purple), var(--brand-blue)); color: #fff; box-shadow: none; }
    .brand-copy small { color: var(--muted); }
    .nav-label { color: var(--muted); }
    .nav-item { color: var(--ink-soft); }
    .nav-item:hover { background: var(--rail-soft); color: var(--ink); }
    .nav-item.active { background: var(--surface); color: var(--ink); border: .5px solid var(--line); box-shadow: inset 3px 0 0 var(--brand-purple), var(--shadow-sm); }
    .nav-icon, .nav-item.active .nav-icon { color: var(--muted); }
    .nav-item.active .nav-icon { color: var(--purple); }
    .nav-count { color: var(--ink-soft); background: var(--surface); border: .5px solid var(--line); }
    .sidebar-footer { border-top-color: var(--line); }
    .workspace-switcher { background: var(--surface); border: .5px solid var(--line); }
    .workspace-avatar { background: linear-gradient(135deg, var(--brand-purple), var(--brand-blue)); color: #fff; }
    .workspace-copy small { color: var(--muted); }
    .topbar { background: rgba(255, 255, 255, .94); border-bottom-color: var(--line); }
    .crumbs .slash { color: var(--line-strong); }
    .searchbox { background: var(--surface-muted); border-color: var(--line); }
    .icon-button { background: var(--surface); border-color: var(--line); }
    .icon-button:hover { background: var(--surface-muted); }
    .avatar { background: linear-gradient(135deg, var(--brand-purple), var(--brand-blue)); }
    .eyebrow { color: var(--purple); }
    .btn { border-color: var(--line); background: var(--surface); color: var(--ink-soft); box-shadow: var(--shadow-sm); }
    .btn:hover { background: var(--surface-muted); }
    .btn.primary { background: linear-gradient(135deg, var(--brand-purple), var(--brand-blue)); border-color: transparent; color: #fff; }
    .btn.primary:hover { background: linear-gradient(135deg, #6c5fe3, #3b85de); }
    .btn.soft { color: var(--blue); background: var(--blue-bg); border-color: var(--border-info, #85b7eb); }
    .btn.warning { color: var(--amber); background: var(--amber-bg); border-color: var(--warning-border); }
    .btn.danger { color: var(--red); background: var(--red-bg); border-color: var(--danger-border); }
    .panel, .metric, .info-box { border-color: var(--line); background: var(--surface); }
    .panel-header, th, .tabs { border-color: var(--line); }
    th { background: var(--surface-muted); }
    tbody tr:hover { background: #fafaf9; }
    .metric-icon.blue, .badge.blue, .notice.blue { color: var(--blue); background: var(--blue-bg); }
    .metric-icon.teal, .badge.teal { color: var(--teal); background: var(--teal-bg); }
    .metric-icon.amber, .badge.amber { color: var(--amber); background: var(--amber-bg); }
    .metric-icon.red, .badge.red { color: var(--red); background: var(--red-bg); }
    .metric-icon.purple, .badge.purple { color: var(--purple); background: var(--purple-bg); }
    .badge.gray { color: var(--muted); background: var(--bg-tertiary, #eeede9); }
    .badge { border: .5px solid transparent; }
    .badge.blue { border-color: #85b7eb; }
    .badge.teal { border-color: var(--success-border); }
    .badge.amber { border-color: var(--warning-border); }
    .badge.red { border-color: var(--danger-border); }
    .badge-icon { display: inline-grid; place-items: center; width: 12px; height: 12px; }
    .badge-icon .icon { width: 12px; height: 12px; }
    .badge::before { display: inline-block; }
    .badge:has(.badge-icon)::before { display: none; }
    .risk-low .risk-dot { background: var(--teal); }
    .risk-medium .risk-dot { background: var(--amber); }
    .risk-high .risk-dot { background: var(--red); }
    .logo-blue { color: var(--blue); background: var(--blue-bg); }
    .logo-teal { color: var(--teal); background: var(--teal-bg); }
    .logo-amber { color: var(--amber); background: var(--amber-bg); }
    .logo-purple { color: var(--purple); background: var(--purple-bg); }
    .tab.active { color: var(--blue); }
    .tab.active::after { background: var(--brand-purple); }
    .tree-row:hover, .tree-row.selected { background: var(--blue-bg); color: var(--blue); }
    .progress { background: var(--bg-tertiary, #eeede9); }
    .progress > span { background: var(--brand-blue); }
    .progress.teal > span { background: var(--teal); }
    .progress.amber > span { background: var(--warning-border); }
    .notice.blue { border-color: #85b7eb; }
    .notice.amber { color: var(--amber); background: var(--amber-bg); border-color: var(--warning-border); }
    .notice.red { color: var(--red); background: var(--red-bg); border-color: var(--danger-border); }
    .empty-icon { color: var(--purple); background: var(--purple-bg); }
    .chip { border-color: var(--line); background: var(--surface-muted); }
    .chip .chip-dot { background: var(--brand-blue); }
    .code-preview { background: #242422; color: #e8e6e0; }
    .code-preview .syntax-key { color: #9d92ff; }
    .code-preview .syntax-string { color: #dda348; }
    .slider { background: var(--line-strong); }
    .switch input:checked + .slider { background: var(--teal); }
    .runtime-status { display: inline-flex; align-items: center; gap: 6px; padding: 5px 9px; border: .5px solid var(--success-border); border-radius: 999px; color: var(--teal); background: var(--teal-bg); font-size: 11px; font-weight: 700; white-space: nowrap; }
    .runtime-status .icon { width: 13px; height: 13px; }
    .context-status { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 9px; border: .5px solid var(--line); border-radius: 999px; color: var(--muted); background: var(--surface); font-size: 11px; white-space: nowrap; }
    .context-status .icon { width: 13px; height: 13px; }
    .status-legend { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 10px 14px; border: .5px solid var(--line); border-radius: var(--radius-md); background: var(--surface); color: var(--muted); font-size: 11px; }
    .status-legend strong { color: var(--ink-soft); margin-right: 2px; }
    .status-token { display: inline-flex; align-items: center; gap: 5px; padding: 4px 7px; border-radius: 999px; font-weight: 700; }
    .status-token .icon { width: 12px; height: 12px; }
    .status-token.success { color: var(--teal); background: var(--teal-bg); }
    .status-token.info { color: var(--blue); background: var(--blue-bg); }
    .status-token.warning { color: var(--amber); background: var(--amber-bg); }
    .status-token.danger { color: var(--red); background: var(--red-bg); }
    @media (max-width: 1120px) { .context-status { display: none; } }
  </style>
</head>

          '<div class="settings-grid"><div class="panel"><div class="panel-header"><div class="panel-title"><h2>默认策略</h2><span class="muted">Product Workspace</span></div></div><div class="panel-body"><div class="setting-group"><h3>Runtime</h3><p>控制新 Package Runtime 是否接收生产流量。</p><div class="toggle-row"><div class="toggle-copy"><strong>启用 Package Runtime</strong><small>支持目录型 Skill、持久化 Run 和 Artifacts</small></div><label class="switch"><input type="checkbox" checked><span class="slider"></span></label></div><div class="toggle-row"><div class="toggle-copy"><strong>允许 Mastra Workspace Skills</strong><small>将可见 Skill Version 注入 Project Workspace</small></div><label class="switch"><input type="checkbox" checked><span class="slider"></span></label></div></div><div class="setting-group"><h3>导入和安全</h3><p>默认拒绝高风险执行，不让导入动作直接触发 Skill Run。</p><div class="toggle-row"><div class="toggle-copy"><strong>允许 GitHub Archive</strong><small>只允许 HTTPS 和指定 GitHub 域名</small></div><label class="switch"><input type="checkbox" checked><span class="slider"></span></label></div><div class="toggle-row"><div class="toggle-copy"><strong>允许 npx 产物目录导入</strong><small>只导入 --copy 生成的本地目录</small></div><label class="switch"><input type="checkbox" checked><span class="slider"></span></label></div><div class="toggle-row"><div class="toggle-copy"><strong>服务端直接执行 npx</strong><small>高风险能力，默认关闭</small></div><label class="switch"><input type="checkbox"><span class="slider"></span></label></div></div><div class="setting-group"><h3>Artifact</h3><p>控制输出文件的存储和自动清理。</p><div class="form-grid"><div class="field"><label>默认保留天数</label><select><option>30 天</option><option>90 天</option><option>永久</option></select></div><div class="field"><label>单 Run 最大 Artifact 数</label><input value="50" /></div></div></div></div></div><div><div class="panel"><div class="panel-header"><div class="panel-title"><h2>Feature Flags</h2></div></div><div class="panel-body"><div class="notice blue"><div>' + icon('info') + '</div><div><strong>当前环境：staging</strong><p>所有新 Runtime 功能可以通过 kill switch 快速关闭。</p></div></div><div class="toggle-row mt-10"><div class="toggle-copy"><strong>动态 Skills Resolver</strong><small>按 Project / Agent / Surface 计算可见集合</small></div><label class="switch"><input type="checkbox" checked><span class="slider"></span></label></div><div class="toggle-row"><div class="toggle-copy"><strong>Hybrid Skill Search</strong><small>BM25 + Vector 混合检索</small></div><label class="switch"><input type="checkbox" checked><span class="slider"></span></label></div><div class="toggle-row"><div class="toggle-copy"><strong>Command Capability</strong><small>即使 Skill 声明也不开放</small></div><label class="switch"><input type="checkbox"><span class="slider"></span></label></div></div></div><div class="panel section-gap"><div class="panel-header"><div class="panel-title"><h2>Runtime 健康</h2><span class="badge teal">Healthy</span></div></div><div class="panel-body"><div class="callout-list"><div class="callout-row"><div class="metric-icon teal">' + icon('check') + '</div><div><strong>Worker heartbeat 正常</strong><small>2 个 Worker · 最近心跳 12 秒前</small></div></div><div class="callout-row"><div class="metric-icon blue">' + icon('database') + '</div><div><strong>Artifact Store 余量充足</strong><small>已用 1.8 GB / 20 GB</small></div></div><div class="callout-row"><div class="metric-icon amber">' + icon('clock') + '</div><div><strong>2 个 Run 等待审批</strong><small>最长等待时间 08:42</small></div></div></div></div></div></div></div>';
      }

      function renderView(view) {
        var target = document.getElementById('view-' + view);
        if (!target) return;
        if (view === 'center') target.innerHTML = renderCenter();
        if (view === 'import') target.innerHTML = renderImport();
        if (view === 'creator') target.innerHTML = renderCreator();
        if (view === 'detail') target.innerHTML = renderDetail();
        if (view === 'permissions') target.innerHTML = renderPermissions();
        if (view === 'runs') target.innerHTML = renderRuns();
        if (view === 'run-detail') target.innerHTML = renderRunDetail();
        if (view === 'artifacts') target.innerHTML = renderArtifacts();
        if (view === 'settings') target.innerHTML = renderSettings();
        bindViewEvents(target);
      }

      function activateView(view) {
        state.view = view;
        document.querySelectorAll('.view').forEach(function (el) { el.classList.toggle('active', el.getAttribute('data-view') === view); });
        document.querySelectorAll('.nav-item').forEach(function (el) { el.classList.toggle('active', el.getAttribute('data-nav') === (view === 'run-detail' ? 'runs' : view)); });
        var labels = { center: 'Skills Center', import: '导入 Skill', creator: 'Skills Creator', detail: 'Skill 详情', permissions: '权限与安装', runs: '运行记录', 'run-detail': 'Run 详情', artifacts: 'Artifacts', settings: '系统设置' };
        document.getElementById('crumb-current').textContent = labels[view] || 'Skills Center';
        renderView(view);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }

      function openModal(title, body, footer, wide) {
        var backdrop = document.getElementById('modal-backdrop');
        var modal = document.getElementById('modal');
        modal.className = 'modal' + (wide ? ' wide' : '');
        modal.innerHTML = '<div class="modal-head"><h2 id="modal-title">' + title + '</h2><button class="close-btn" aria-label="关闭" data-action="close-modal">' + icon('close') + '</button></div><div class="modal-body">' + body + '</div>' + (footer ? '<div class="modal-foot">' + footer + '</div>' : '');
        modal.querySelectorAll('[data-action]').forEach(function (el) { el.addEventListener('click', handleAction); });
        backdrop.classList.add('open');
        var focusable = modal.querySelector('button, input, textarea, select');
        if (focusable) focusable.focus();
      }
      function closeModal() { document.getElementById('modal-backdrop').classList.remove('open'); }

      function bindViewEvents(target) {
        target.querySelectorAll('[data-action]').forEach(function (el) {
          el.addEventListener('click', handleAction);
        });
        target.querySelectorAll('input[data-capability]').forEach(function (el) {
          el.addEventListener('change', function () {
            var key = el.getAttribute('data-capability');
            if (el.checked && state.creatorCapabilities.indexOf(key) < 0) state.creatorCapabilities.push(key);
            if (!el.checked) state.creatorCapabilities = state.creatorCapabilities.filter(function (item) { return item !== key; });
            renderView('creator');
          });
        });
        var centerInput = target.querySelector('#center-search');
        if (centerInput) centerInput.addEventListener('input', function () { state.centerSearch = centerInput.value; renderView('center'); var refreshed = document.getElementById('center-search'); if (refreshed) { refreshed.focus(); refreshed.setSelectionRange(refreshed.value.length, refreshed.value.length); } });
        var creatorName = target.querySelector('#creator-name');
        var creatorDescription = target.querySelector('#creator-description');
        if (creatorName) creatorName.addEventListener('input', function () { var value = creatorName.value; var start = creatorName.selectionStart; var end = creatorName.selectionEnd; renderView('creator'); var el = document.getElementById('creator-name'); if (el) { el.value = value; el.focus(); el.setSelectionRange(start, end); } });
        if (creatorDescription) creatorDescription.addEventListener('input', function () { var value = creatorDescription.value; var start = creatorDescription.selectionStart; var end = creatorDescription.selectionEnd; renderView('creator'); var el = document.getElementById('creator-description'); if (el) { el.value = value; el.focus(); el.setSelectionRange(start, end); } });
        var creatorRuntime = target.querySelector('#creator-runtime');
        if (creatorRuntime) creatorRuntime.addEventListener('change', function () { state.creatorRuntime = creatorRuntime.value; renderView('creator'); });
      }

      function handleAction(event) {
        var el = event.currentTarget;
        var action = el.getAttribute('data-action');
        var id = el.getAttribute('data-id');
        if (action === 'go-center') return activateView('center');
        if (action === 'go-import') return activateView('import');
        if (action === 'go-creator') return activateView('creator');
        if (action === 'go-runs') return activateView('runs');
        if (action === 'go-artifacts') return activateView('artifacts');
        if (action === 'open-detail') { state.selectedSkillId = id; state.detailTab = 'overview'; return activateView('detail'); }
        if (action === 'detail-tab') { state.detailTab = el.getAttribute('data-tab'); return renderView('detail'); }
        if (action === 'center-filter') { state.centerFilter = el.getAttribute('data-filter'); return renderView('center'); }
        if (action === 'import-source') { state.importSource = el.getAttribute('data-source'); return renderView('import'); }
        if (action === 'scan-import') { return toast('扫描任务已创建', '导入包正在进行静态检查，完成后会进入待安装列表。', 'teal'); }
        if (action === 'choose-folder' || action === 'choose-zip') { return toast('原型交互', '这里会调用桌面文件选择器或浏览器上传控件。', 'blue'); }
        if (action === 'save-creator') { return toast('Draft 已保存', 'Article Illustration Assistant · v0.1.0-draft 已写入 Creator 草稿。', 'teal'); }
        if (action === 'creator-next') { return toast('文件结构已生成', 'SKILL.md、references 和 assets 目录已准备进入验证步骤。', 'teal'); }
        if (action === 'preview-skill') { return openModal('SKILL.md 预览', creatorPreview(), actionButton('复制内容', 'soft', 'copy-file') + actionButton('关闭', '', 'close-modal'), true); }
        if (action === 'toggle-skill') { var skill = getSkill(id); skill.status = skill.status === 'enabled' ? 'disabled' : 'enabled'; skill.statusText = skill.status === 'enabled' ? '已启用' : '已禁用'; skill.statusTone = skill.status === 'enabled' ? 'teal' : 'gray'; renderView(state.view); return toast(skill.status === 'enabled' ? 'Skill 已启用' : 'Skill 已禁用', skill.name + ' 的安装关系已更新。', skill.status === 'enabled' ? 'teal' : 'amber'); }
        if (action === 'start-run') { state.selectedSkillId = id || state.selectedSkillId; return openModal('启动 Skill Run', '<div class="notice blue"><div>' + icon('info') + '</div><div><strong>' + getSkill(state.selectedSkillId).name + ' · v' + getSkill(state.selectedSkillId).version + '</strong><p>Run 会固定当前 Skill Version；执行中如果需要高风险能力，会进入 waiting_approval。</p></div></div><div class="form-grid mt-18"><div class="field full"><label>输入摘要</label><textarea>请根据当前文章生成 6 张配图，并保存 Prompt 与 Markdown 计划。</textarea></div><div class="field"><label>Surface</label><select><option>Image</option><option>Chat</option><option>Skills API</option></select></div><div class="field"><label>Policy Profile</label><select><option>image-default</option><option>read-only</option><option>strict</option></select></div></div>', actionButton('取消', '', 'close-modal') + actionButton('创建 Run', 'primary', 'confirm-start-run', state.selectedSkillId, 'play')); }
        if (action === 'confirm-start-run') { closeModal(); var newRun = { id: 'run-20260805-' + String(Date.now()).slice(-4), skill: getSkill(id).name, version: getSkill(id).version, surface: 'Image', status: 'queued', statusText: '已排队', tone: 'blue', started: '刚刚', duration: '00:00', step: '等待 Worker 消费', user: 'xing', artifacts: 0, input: '请根据当前文章生成 6 张配图，并保存 Prompt 与 Markdown 计划。' }; runs.unshift(newRun); state.selectedRunId = newRun.id; activateView('run-detail'); return toast('Run 已创建', '已进入队列，Worker 将在后台开始执行。', 'teal'); }
        if (action === 'open-run') { state.selectedRunId = id; return activateView('run-detail'); }
        if (action === 'cancel-run') { var run = getRun(id); run.status = 'cancelled'; run.statusText = '已取消'; run.tone = 'gray'; run.step = '由用户取消'; renderView(state.view); return toast('Run 已取消', id + ' 已写入取消事件。', 'amber'); }
        if (action === 'rerun') { closeModal(); return toast('已创建重试 Run', '新的 Run 会固定当前 Skill Version 并记录 retryOf。', 'teal'); }
        if (action === 'refresh-run' || action === 'refresh-runs' || action === 'refresh-artifacts') return toast('数据已刷新', '已拉取最新的 Worker、Event 和 Artifact 状态。', 'teal');
        if (action === 'open-artifact') { var art = getArtifact(id); return openModal('Artifact 预览', '<div class="artifact-thumb ' + art.color + '" style="height:180px;border-radius:8px">' + icon(art.type === 'image' ? 'image' : art.type === 'pdf' ? 'fileText' : 'file') + '</div><div class="mt-14"><h3>' + art.name + '</h3><p class="muted mt-10">' + art.label + ' · ' + art.size + ' · 创建于 ' + art.created + '</p><div class="notice blue mt-14"><div>' + icon('link') + '</div><div><strong>来源追溯</strong><p>' + art.skill + ' · ' + art.run + ' · 可根据 runId 复现。</p></div></div></div>', actionButton('下载 Artifact', 'soft', 'download-artifact', art.id, 'download') + actionButton('关闭', '', 'close-modal'), true); }
        if (action === 'download-artifact' || action === 'download-package') { closeModal(); return toast('下载已准备', '原型中会从 Artifact Store 生成受控下载链接。', 'teal'); }
        if (action === 'copy-file') { return toast('已复制', '文件内容已复制到剪贴板（原型反馈）。', 'teal'); }
        if (action === 'check-update') { return toast('检查完成', '发现 v1.5.0，可查看 Capability Diff 后更新。', 'blue'); }
        if (action === 'new-version') { return activateView('creator'); }
        if (action === 'open-diff') { return openModal('版本 Diff · v' + id, '<div class="notice amber"><div>' + icon('shield') + '</div><div><strong>更新前需要重新确认权限</strong><p>新版本声明 image_generate；当前 Installation 不会自动切换。</p></div></div><div class="divider"></div><pre class="code-preview"><span class="syntax-comment">@@ SKILL.md</span>\n<span class="syntax-key">+ image_generate</span>\n<span class="syntax-key">+ max 6 images per run</span>\n<span class="syntax-comment">@@ references/workflow.md</span>\n<span class="syntax-string">+ retry partial failures</span></pre>', actionButton('稍后处理', '', 'close-modal') + actionButton('创建更新草稿', 'primary', 'confirm-update', id, 'edit'), true); }
        if (action === 'confirm-update') { closeModal(); return toast('更新草稿已创建', '新版本已进入待审核状态，不会影响当前运行。', 'teal'); }
        if (action === 'edit-policy' || action === 'manage-installation' || action === 'new-policy') { return openModal(action === 'new-policy' ? '新建权限策略' : '编辑 Capability Policy', '<div class="form-grid"><div class="field"><label>Policy Name</label><input value="image-default" /></div><div class="field"><label>作用范围</label><select><option>Product Workspace</option><option>BloomAI Core</option></select></div><div class="field full"><label>允许能力</label><div class="cap-select-grid"><label class="cap-option"><input type="checkbox" checked><span><strong>skill_read</strong><small>默认允许只读</small></span></label><label class="cap-option"><input type="checkbox" checked><span><strong>image_generate</strong><small>Session Grant</small></span></label><label class="cap-option"><input type="checkbox"><span><strong>workspace_write</strong><small>每次审批</small></span></label><label class="cap-option"><input type="checkbox"><span><strong>command</strong><small>强制拒绝</small></span></label></div></div></div>', actionButton('取消', '', 'close-modal') + actionButton('保存策略', 'primary', 'save-policy', null, 'check')); }
        if (action === 'save-policy') { closeModal(); return toast('策略已保存', '新的 Capability Policy 将应用于后续 Run。', 'teal'); }
        if (action === 'approve-grant') { var grant = grants.find(function (g) { return g.id === id; }); if (grant) { grant.state = 'active'; grant.expires = '本次 Run'; grant.by = '用户批准'; } renderView(state.view); return toast('权限已批准', 'Worker 可以继续执行等待中的 Run。', 'teal'); }
        if (action === 'reject-grant') { var reject = grants.find(function (g) { return g.id === id; }); if (reject) { reject.state = 'revoked'; reject.expires = '已拒绝'; } renderView(state.view); return toast('已拒绝权限', 'Run 将收到 capability_denied 事件。', 'amber'); }
        if (action === 'revoke-grant') { var revoke = grants.find(function (g) { return g.id === id; }); if (revoke) { revoke.state = 'revoked'; revoke.expires = '已撤销'; } renderView(state.view); return toast('权限已撤销', '后续 Tool Call 将被 Capability Broker 拒绝。', 'amber'); }
        if (action === 'audit-export' || action === 'export-events' || action === 'export-artifacts') return toast('导出任务已创建', '系统会生成脱敏后的 CSV / JSON 下载文件。', 'teal');
        if (action === 'surface-toggle' || action === 'installation-toggle') return toast('设置已更新', '新的可见性配置将在下一次 Agent 请求生效。', 'teal');
        if (action === 'save-settings') return toast('设置已保存', 'Feature Flags 和默认策略已写入 Workspace。', 'teal');
        if (action === 'filters') return toast('筛选面板', '真实产品中这里会展开多条件筛选抽屉。', 'blue');
        if (action === 'uninstall-skill') { var uninstallSkill = getSkill(id); return openModal('确认卸载 Skill', '<div class="notice red"><div>' + icon('stop') + '</div><div><strong>' + htmlEscape(uninstallSkill.name) + '</strong><p>卸载后将从当前 Workspace 移除 Installation，历史 Run 和 Artifact 会保留。</p></div></div><p class="muted mt-14">这是针对当前 Skill 的单动作确认，不会修改其他 Skill 的状态。</p>', actionButton('取消', '', 'close-modal') + actionButton('确认卸载', 'danger', 'confirm-uninstall', id, 'stop')); }
        if (action === 'confirm-uninstall') { var skillToUninstall = getSkill(id); closeModal(); skillToUninstall.install = '未安装'; skillToUninstall.status = 'disabled'; skillToUninstall.statusText = '未安装'; skillToUninstall.statusTone = 'gray'; renderView(state.view); return toast('卸载已完成', skillToUninstall.name + ' 已从当前 Workspace 卸载，历史 Run 和 Artifact 将保留。', 'amber'); }
        if (action === 'notifications') return openModal('通知中心', '<div class="mini-list"><div class="mini-item"><div class="metric-icon amber">' + icon('lock') + '</div><div class="mini-copy"><strong>Research Analysis 等待审批</strong><small>workspace_write · 08:42</small></div><span class="badge amber no-dot">Pending</span></div><div class="mini-item"><div class="metric-icon blue">' + icon('refresh') + '</div><div class="mini-copy"><strong>Article Illustrator 有新版本</strong><small>v1.5.0 · Capability Diff 可查看</small></div><span class="badge blue no-dot">Update</span></div></div>', actionButton('全部标为已读', 'soft', 'close-modal') + actionButton('关闭', '', 'close-modal')); 
        if (action === 'help') return openModal('Skills Control Plane 帮助', '<div class="notice blue"><div>' + icon('info') + '</div><div><strong>Control Plane 与 Runtime 分离</strong><p>BloomAI 负责 Catalog、Import、Install、Policy、Run、Artifact 和 Audit；Mastra 负责 Agent 运行时 Skill 发现、搜索、读取和激活。</p></div></div><div class="divider"></div><p class="muted">当前原型覆盖文档 6.7 中的后台管理界面和 Skills Creator 主流程。</p>', actionButton('关闭', '', 'close-modal')); 
        if (action === 'close-modal') return closeModal();
        if (action === 'mobile-nav') return toast('移动端导航', '实际产品中会展开侧边导航抽屉。', 'blue');
        if (action === 'refresh-artifacts') return toast('Artifact 列表已刷新', '已读取最新的 Artifact Store 状态。', 'teal');
      }

      document.querySelectorAll('[data-nav]').forEach(function (el) { el.addEventListener('click', function () { activateView(el.getAttribute('data-nav')); }); });
      document.getElementById('global-search').addEventListener('input', function (event) { state.centerSearch = event.target.value; if (state.view !== 'center') activateView('center'); else renderView('center'); });
      document.getElementById('modal-backdrop').addEventListener('click', function (event) { if (event.target.id === 'modal-backdrop') closeModal(); });
      document.addEventListener('keydown', function (event) { if (event.key === 'Escape') closeModal(); });
      renderView('center');
    })();
  </script>
</body>
</html>
